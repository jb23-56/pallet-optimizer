name: Deploy Pallet Optimizer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -o pallet-optimizer-github-ready.zip

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pallet_optimizer/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: pallet_optimizer
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Comprobar TypeScript
        working-directory: pallet_optimizer
        run: pnpm run check

      - name: Compilar aplicación
        working-directory: pallet_optimizer
        run: pnpm run build

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir aplicación compilada
        uses: actions/upload-pages-artifact@v3
        with:
          path: pallet_optimizer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
